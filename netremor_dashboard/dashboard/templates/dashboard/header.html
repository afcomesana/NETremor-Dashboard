<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'dashboard/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'dashboard/bootstrap/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">

    <script src="{% static 'dashboard/bootstrap/js/bootstrap.min.js' %}"></script>
    <script src="{% static 'dashboard/d3.v7.min.js' %}"></script>
    <script src="{% static 'dashboard/main.js' %}"></script>

    <title>NETremor Dashboard</title>
</head>
<body>
    {% if not hide_topbar %}
        <div class="bg-primary-light-subtle py-4 mb-5">
            <header class="container site-header">
                <div class="row align-items-center">
                    <div class="col-12 col-md-3" id="site-logo-container">
                        <a href="{% url 'dashboard:index' %}" class="h1">NETremor</a>
                    </div>
                    <div class="col-12 col-md-9 d-flex justify-content-end">
                        {% if user.is_authenticated %}
                            <a class="h5 text-dark transition-02 hover-text-dark-subtle" href="{% url 'dashboard:logout' %}">Log out</a>
                        {% endif %}
                    </div>
                </div>
            </header>
        </div>
    {% endif %}
